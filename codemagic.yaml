# DOGR (our own file, not upstream's). The Codemagic side of a Dogr release: it builds the two macOS
# payloads of a Dogr build, so a release does not have to wait for GitHub's hosted macOS pool, which is
# often out of capacity (see the comment on the `payload` job in .github/workflows/dogr-release.yml).
#
# THIS IS THE FIRST STEP AND IT PUBLISHES NOTHING. It has no `triggering` and no `publishing`, so it only
# runs when someone presses "Start new build" for a branch, and what it makes stays in the build's
# artifacts for download. Checking those files (the signature identifier, the sha256, the version) comes
# before anything is wired into the release job. The same tag keeps running dogr-release.yml on GitHub.
#
# The work is in scripts/dogr-macos-payload.sh, which does the same steps as the GitHub job.
# A build started from a TAG webhook has CM_TAG set and makes the stamped release payloads; a build
# started by hand for a branch is a TEST build (not stamped, not a release).
workflows:
  dogr-macos-payloads:
    name: Dogr macOS payloads
    # Apple Silicon, the machine the free plan gives minutes on. macos-x64 is cross-compiled on it.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        # The repository every update default of the binary is pointed at (scripts/dogr-stamp.ts --repo).
        DOGR_REPO: mithyer/collie
    scripts:
      - name: Install Nix
        script: |
          set -euo pipefail
          # The build environment is flake.nix (Bun, node, git of flake.lock), as on the GitHub runner,
          # whose installer action is DeterminateSystems/nix-installer-action.
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install --no-confirm
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version
      - name: Build, sign and seal the macOS payloads
        script: |
          set -euo pipefail
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          # CM_TAG is set only when the build was started by a tag; empty means a test build.
          export DOGR_TAG="${CM_TAG:-}"
          export DOGR_OUT="$CM_BUILD_DIR/dogr-out"
          bash scripts/dogr-macos-payload.sh
    artifacts:
      # The tarballs, their .sha256 files and the <platform>.artifact.json descriptions.
      - dogr-out/*
